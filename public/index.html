<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShowShare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>ShowShare</h1>
      <p class="subtitle">What should we watch?</p>
    </header>

    <div class="filter-section" id="filterSection"></div>

    <div class="add-section">
      <input type="text" id="titleInput" placeholder="Add a movie or show..." autocomplete="off">
      <div class="type-toggle">
        <button class="type-btn active" data-type="movie">🎬 Movie</button>
        <button class="type-btn" data-type="show">📺 Show</button>
      </div>
      <div class="person-toggle" id="personToggle"></div>
      <button id="addBtn" class="add-btn">Add</button>
    </div>

    <ul id="list" class="list"></ul>

    <div class="empty-state" id="emptyState">
      <span class="empty-icon">🍿</span>
      <p>No shows yet. Add something!</p>
    </div>
  </div>

  <div class="modal" id="editModal">
    <div class="modal-content">
      <h2>Edit</h2>
      <input type="text" id="editInput" placeholder="Title">
      <div class="type-toggle">
        <button class="type-btn" data-type="movie" id="editMovie">🎬 Movie</button>
        <button class="type-btn" data-type="show" id="editShow">📺 Show</button>
      </div>
      <div class="person-toggle modal-person" id="editPersonToggle"></div>
      <div class="modal-actions">
        <button class="cancel-btn" id="cancelEdit">Cancel</button>
        <button class="save-btn" id="saveEdit">Save</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
